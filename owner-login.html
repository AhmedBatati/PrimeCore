<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>دخول المالك - PrimeCore</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-page">
  <button class="theme-toggle admin-theme-toggle" type="button" data-theme-toggle aria-label="تبديل الوضع" aria-pressed="false">
    <span class="theme-toggle-icon theme-toggle-sun" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
    </span>
    <span class="theme-toggle-icon theme-toggle-moon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M21 12.8A8.5 8.5 0 1 1 11.2 3 6.5 6.5 0 0 0 21 12.8z"/>
      </svg>
    </span>
    <span class="sr-only">تبديل الوضع</span>
  </button>
  <main class="login-shell">
    <section class="login-card admin-panel">
      <div class="admin-title">
        <span class="section-label">PrimeCore</span>
        <h1>دخول المالك</h1>
        <p>أدخل كلمة مرور المالك للوصول إلى لوحة الإدارة.</p>
      </div>

      <form class="admin-form" id="owner-login-form" autocomplete="off">
        <div class="admin-field">
          <label for="owner-password">كلمة المرور</label>
          <input type="password" id="owner-password" required autofocus>
        </div>

        <p class="login-error" id="login-error" role="alert"></p>

        <div class="admin-form-actions">
          <button class="btn btn-gradient" type="submit">دخول</button>
          <a href="index.html" class="btn btn-outline">العودة للموقع</a>
        </div>
      </form>
    </section>
  </main>

  <script src="js/admin-store.js"></script>
  <script src="js/owner-login.js"></script>
</body>
</html>
